[project]
name = "ce"
version = "0.1.0"
description = "Compaction evals: real agent harnesses (Claude Code, Codex CLI) with controllable compaction"
requires-python = ">=3.12"
dependencies = ["inspect-ai>=0.3.281", "inspect-swe>=0.2.71", "pyyaml", "pandas", "aiohttp"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ce"]
